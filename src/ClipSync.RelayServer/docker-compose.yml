services:
  clipsync-relay:
    build: .
    image: clipsync-relay:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - ${APNS_PRIVATE_KEY_HOST_PATH}:/keys/AuthKey.p8:ro
    environment:
      ASPNETCORE_URLS: "http://+:${APP_PORT:-8080}"
      RELAY_KEY: ${RELAY_KEY}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
      APNS_PRIVATE_KEY_PATH: /keys/AuthKey.p8
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-true}
